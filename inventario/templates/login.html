<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Iniciar sesión - TechLogix S.A.</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #172b4d;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        background: white;
        width: 350px;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    }

    h1 {
        text-align: center;
        color: #172b4d;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 25px;
        background: #1976d2;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #125ca1;
    }

    .error {
        background: #f8d7da;
        color: #842029;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
    }

    .volver {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #1976d2;
        text-decoration: none;
    }
</style>

</head> <body> <div class="login-container">
<h1>TechLogix S.A.</h1>
<p style="text-align:center;">Área de Administración</p>

{% if form.errors %}
    <div class="error">
        Usuario o contraseña incorrectos.
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="id_username">Usuario</label>
    <input
        type="text"
        name="username"
        id="id_username"
        required
        autofocus
    >

    <label for="id_password">Contraseña</label>
    <input
        type="password"
        name="password"
        id="id_password"
        required
    >

    <button type="submit">
        Iniciar sesión
    </button>

    <input
        type="hidden"
        name="next"
        value="{{ next }}"
    >
</form>

<a class="volver" href="{% url 'inicio' %}">
    Volver al inicio
</a>

</div> </body> </html>
